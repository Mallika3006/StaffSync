<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>My Tasks - StaffSync</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>

<body>

<div class="container">

    ```
    <h1>My Tasks</h1>

    <div class="card" id="tasks">

        <p class="loading">
            Loading tasks...
        </p>

    </div>


    <a class="back-link" href="/employee-dashboard">
        ← Back to Dashboard
    </a>
    ```

</div>

<script>

    // =========================================================
    // LOAD MY TASKS
    // =========================================================

    fetch('/tasks/me')

        .then(response => {

            if (!response.ok) {

                throw new Error(
                    "Failed to load tasks"
                );

            }

            return response.json();

        })


        .then(taskList => {

            const tasksDiv =
                document.getElementById("tasks");


            // =====================================================
            // NO TASKS
            // =====================================================

            if (taskList.length === 0) {

                tasksDiv.innerHTML =

                    "<p class='empty-message'>" +
                    "No tasks found." +
                    "</p>";

                return;
            }


            // =====================================================
            // SEPARATE COMPLETED AND PENDING
            // =====================================================

            const completedTasks =
                taskList.filter(task =>

                    task.status &&

                    task.status.toLowerCase() ===
                    "completed"

                );


            const pendingTasks =
                taskList.filter(task =>

                    !task.status ||

                    task.status.toLowerCase() !==
                    "completed"

                );


            // =====================================================
            // CREATE TASK TABLE
            // =====================================================

            function createTaskTable(tasks) {

                if (tasks.length === 0) {

                    return `
                        <p class="empty-message">
                            No tasks in this section.
                        </p>
                    `;

                }


                let html = `

                    <table>

                        <tr>

                            <th>Task ID</th>

                            <th>Task Name</th>

                            <th>Description</th>

                            <th>Priority</th>

                            <th>Status</th>

                            <th>Start Date</th>

                            <th>Due Date</th>

                        </tr>

                `;


                tasks.forEach(task => {

                    html += `

                        <tr>

                            <td>
                                ${task.taskId}
                            </td>

                            <td>
                                ${task.taskName}
                            </td>

                            <td>
                                ${task.description ?? "-"}
                            </td>

                            <td>
                                ${task.priority ?? "-"}
                            </td>

                            <td>
                                ${task.status ?? "-"}
                            </td>

                            <td>
                                ${task.startDate ?? "-"}
                            </td>

                            <td>
                                ${task.dueDate ?? "-"}
                            </td>

                        </tr>

                    `;

                });


                html += `</table>`;

                return html;

            }


            // =====================================================
            // DISPLAY SECTIONS
            // =====================================================

            let html = `

                <h3>My Task Records</h3>


                <details>

                    <summary>
                        Completed
                    </summary>

                    ${createTaskTable(
                completedTasks
            )}

                </details>


                <br>


                <details>

                    <summary>
                        Pending
                    </summary>

                    ${createTaskTable(
                pendingTasks
            )}

                </details>

            `;


            tasksDiv.innerHTML = html;

        })


        // =========================================================
        // ERROR HANDLING
        // =========================================================

        .catch(error => {

            document.getElementById("tasks").innerHTML =

                "<p class='error-message'>" +
                "Unable to load tasks." +
                "</p>";

            console.error(error);

        });

</script>

</body>

</html>
