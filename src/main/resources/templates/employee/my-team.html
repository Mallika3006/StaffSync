<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>My Team - StaffSync</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>

<body>

<div class="container">

    ```
    <h1>My Team</h1>

    <div class="card" id="team">
        <p class="loading">Loading team members...</p>
    </div>

    <a class="back-link" href="/employee-dashboard">
        ← Back to Dashboard
    </a>
    ```

</div>

<script>

    fetch('/teams/me/members')
        .then(response => {

            if (!response.ok) {
                throw new Error("Failed to load team");
            }

            return response.json();
        })

        .then(memberList => {

            const teamDiv =
                document.getElementById("team");

            if (memberList.length === 0) {

                teamDiv.innerHTML =
                    "<p class='empty-message'>No team members found.</p>";

                return;
            }

            let html = `
                <table>

                    <tr>
                        <th>Employee ID</th>
                        <th>First Name</th>
                        <th>Last Name</th>
                        <th>Email</th>
                    </tr>
            `;

            memberList.forEach(member => {

                html += `
                    <tr>
                        <td>${member.employeeId}</td>
                        <td>${member.firstName}</td>
                        <td>${member.lastName}</td>
                        <td>${member.email}</td>
                    </tr>
                `;
            });

            html += `</table>`;

            teamDiv.innerHTML = html;
        })

        .catch(error => {

            document.getElementById("team").innerHTML =
                "<p class='error-message'>Unable to load team members.</p>";

            console.error(error);
        });

</script>

</body>
</html>
