<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>My Department</title>
</head>

<body>

<h1>My Department</h1>

<div id="department">
    Loading department...
</div>

<br>

<a href="/employee-dashboard">Back to Dashboard</a>

<script>
    fetch('/departments/me')
        .then(response => {
            if (!response.ok) {
                throw new Error("Failed to load department");
            }
            return response.json();
        })
        .then(department => {

            const departmentDiv =
                document.getElementById("department");

            departmentDiv.innerHTML = `
                <p><strong>Department ID:</strong>
                    ${department.departmentId}</p>

                <p><strong>Name:</strong>
                    ${department.name}</p>

                <p><strong>Location:</strong>
                    ${department.location}</p>

                <p><strong>Description:</strong>
                    ${department.description}</p>
            `;
        })
        .catch(error => {
            document.getElementById("department").innerHTML =
                "<p>Unable to load department.</p>";
            console.error(error);
        });
</script>

</body>
</html>
