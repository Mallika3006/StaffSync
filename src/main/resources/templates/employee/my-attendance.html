<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>My Attendance - StaffSync</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>

<body>

<div class="container">

    ```
    <h1>My Attendance</h1>

    <div class="card" id="attendance">

        <p class="loading">
            Loading attendance...
        </p>

    </div>


    <a class="back-link" href="/employee-dashboard">
        ← Back to Dashboard
    </a>
    ```

</div>

<script>

    // =========================================================
    // LOAD MY ATTENDANCE
    // =========================================================

    fetch('/attendance/me')

        .then(response => {

            if (!response.ok) {

                throw new Error(
                    "Failed to load attendance"
                );

            }

            return response.json();

        })


        .then(attendanceList => {

            const attendanceDiv =
                document.getElementById("attendance");


            // =====================================================
            // COUNT PRESENT DAYS
            // =====================================================

            const presentDays =
                attendanceList.filter(attendance =>

                    attendance.status &&

                    attendance.status.toLowerCase() === "present"

                ).length;


            // =====================================================
            // COUNT ABSENT DAYS
            // =====================================================

            const absentDays =
                attendanceList.filter(attendance =>

                    attendance.status &&

                    attendance.status.toLowerCase() === "absent"

                ).length;


            // =====================================================
            // DISPLAY ATTENDANCE SUMMARY
            // =====================================================

            attendanceDiv.innerHTML = `

                <h3>Attendance Summary</h3>

                <div class="attendance-summary">

                    <div class="attendance-box">

                        <h4>Days Present</h4>

                        <p>
                            ${presentDays}
                        </p>

                    </div>


                    <div class="attendance-box">

                        <h4>Days Absent</h4>

                        <p>
                            ${absentDays}
                        </p>

                    </div>

                </div>

            `;

        })


        // =========================================================
        // ERROR HANDLING
        // =========================================================

        .catch(error => {

            document.getElementById("attendance").innerHTML =

                "<p class='error-message'>" +

                "Unable to load attendance." +

                "</p>";

            console.error(error);

        });

</script>

</body>

</html>
