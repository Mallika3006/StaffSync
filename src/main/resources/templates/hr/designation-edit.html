<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Edit Designation - StaffSync</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>

<body>

<div class="container">

    <h1>Edit Designation</h1>

    <div class="card">

        <form id="designationForm">

            <label>Designation Title:</label>
            <input
                    type="text"
                    id="designationTitle"
                    required>

            <br><br>

            <label>Minimum Salary:</label>
            <input
                    type="number"
                    id="minSalary"
                    step="0.01"
                    min="0">

            <br><br>

            <label>Maximum Salary:</label>
            <input
                    type="number"
                    id="maxSalary"
                    step="0.01"
                    min="0">

            <br><br>

            <button type="submit">
                Update Designation
            </button>

        </form>

    </div>

    <div class="dashboard-links">

        <a href="/hr/designations">
            Back to Designations
        </a>

        <a href="/hr-dashboard">
            Back to HR Dashboard
        </a>

    </div>

</div>


<script>

    // =========================
    // GET DESIGNATION ID FROM URL
    // =========================

    const pathParts = window.location.pathname.split("/");

    const designationId = pathParts[3];

    console.log("Designation ID:", designationId);


    // =========================
    // LOAD DESIGNATION
    // =========================

    async function loadDesignation() {

        try {

            const response =
                await fetch(`/designations/${designationId}`);

            if (!response.ok) {

                const errorText =
                    await response.text();

                console.error(errorText);

                throw new Error(
                    "Failed to fetch designation"
                );
            }

            const designation =
                await response.json();


            document.getElementById("designationTitle").value =
                designation.designationTitle ?? "";

            document.getElementById("minSalary").value =
                designation.minSalary ?? "";

            document.getElementById("maxSalary").value =
                designation.maxSalary ?? "";


        } catch (error) {

            console.error(error);

            alert("Error loading designation");
        }
    }


    // =========================
    // UPDATE DESIGNATION
    // =========================

    document.getElementById("designationForm")
        .addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                const designation = {

                    designationTitle:
                    document.getElementById(
                        "designationTitle"
                    ).value,

                    minSalary:
                        document.getElementById(
                            "minSalary"
                        ).value
                            ? Number(
                                document.getElementById(
                                    "minSalary"
                                ).value
                            )
                            : null,

                    maxSalary:
                        document.getElementById(
                            "maxSalary"
                        ).value
                            ? Number(
                                document.getElementById(
                                    "maxSalary"
                                ).value
                            )
                            : null
                };


                try {

                    const response =
                        await fetch(
                            `/designations/${designationId}`,
                            {
                                method: "PUT",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body:
                                    JSON.stringify(
                                        designation
                                    )
                            }
                        );


                    if (!response.ok) {

                        const errorText =
                            await response.text();

                        console.error(errorText);

                        throw new Error(
                            "Failed to update designation"
                        );
                    }


                    alert(
                        "Designation updated successfully!"
                    );

                    window.location.href =
                        "/hr/designations";


                } catch (error) {

                    console.error(error);

                    alert(
                        "Error updating designation"
                    );
                }

            }
        );


    // =========================
    // INITIAL LOAD
    // =========================

    loadDesignation();

</script>

</body>
</html>
