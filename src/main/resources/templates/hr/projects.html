<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Projects - StaffSync</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>

<body>

<div class="container">

    <h1>Project Management</h1>

    <!-- Add Project -->
    <div class="card">

        <h2>Add Project</h2>

        <form id="projectForm">

            <label>Project Name:</label>
            <input
                    type="text"
                    id="projectName"
                    required>

            <br><br>

            <label>Start Date:</label>
            <input
                    type="date"
                    id="startDate">

            <br><br>

            <label>End Date:</label>
            <input
                    type="date"
                    id="endDate">

            <br><br>

            <button type="submit">
                Add Project
            </button>

        </form>

    </div>


    <!-- Search -->
    <div class="card">

        <h2>Search Projects</h2>

        <input
                type="text"
                id="searchName"
                placeholder="Enter project name">

        <button onclick="searchProjects()">
            Search
        </button>

        <button onclick="loadProjects()">
            Show All
        </button>

    </div>


    <!-- Project List -->
    <div class="card">

        <h2>Projects</h2>

        <table>

            <thead>

            <tr>
                <th>ID</th>
                <th>Project Name</th>
                <th>Start Date</th>
                <th>End Date</th>
                <th>Actions</th>
            </tr>

            </thead>

            <tbody id="projectTableBody">

            </tbody>

        </table>

    </div>


    <div class="dashboard-links">

        <a href="/hr-dashboard">
            Back to HR Dashboard
        </a>

    </div>

</div>


<script>

    // =========================
    // LOAD ALL PROJECTS
    // =========================

    async function loadProjects() {

        try {

            const response =
                await fetch("/projects");

            if (!response.ok) {
                throw new Error("Failed to fetch projects");
            }

            const projects =
                await response.json();

            displayProjects(projects);

        } catch (error) {

            console.error(error);

            alert("Error loading projects");
        }
    }


    // =========================
    // DISPLAY PROJECTS
    // =========================

    function displayProjects(projects) {

        const tableBody =
            document.getElementById("projectTableBody");

        tableBody.innerHTML = "";

        projects.forEach(project => {

            const row =
                document.createElement("tr");

            row.innerHTML = `

                <td>${project.projectId}</td>

                <td>${project.projectName ?? ""}</td>

                <td>${project.startDate ?? ""}</td>

                <td>${project.endDate ?? "Ongoing"}</td>

                <td>

                    <button
                        onclick="viewProject(${project.projectId})">
                        View
                    </button>

                    <button
                        onclick="editProject(${project.projectId})">
                        Edit
                    </button>

                    <button
                        onclick="deleteProject(${project.projectId})">
                        Delete
                    </button>

                </td>
            `;

            tableBody.appendChild(row);

        });
    }


    // =========================
    // ADD PROJECT
    // =========================

    document.getElementById("projectForm")
        .addEventListener("submit", async function(event) {

            event.preventDefault();

            const project = {

                projectName:
                document.getElementById("projectName").value,

                startDate:
                    document.getElementById("startDate").value || null,

                endDate:
                    document.getElementById("endDate").value || null
            };


            try {

                const response =
                    await fetch("/projects", {

                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify(project)
                    });


                if (!response.ok) {

                    const errorText =
                        await response.text();

                    console.error(errorText);

                    throw new Error("Failed to create project");
                }


                alert("Project added successfully!");

                document.getElementById("projectForm").reset();

                loadProjects();

            } catch (error) {

                console.error(error);

                alert("Error adding project");
            }

        });


    // =========================
    // SEARCH
    // =========================

    async function searchProjects() {

        const name =
            document.getElementById("searchName").value.trim();


        if (name === "") {

            loadProjects();

            return;
        }


        try {

            const response =
                await fetch(
                    `/projects/search?name=${encodeURIComponent(name)}`
                );


            if (!response.ok) {
                throw new Error("Search failed");
            }


            const projects =
                await response.json();

            displayProjects(projects);

        } catch (error) {

            console.error(error);

            alert("Error searching projects");
        }
    }


    // =========================
    // VIEW
    // =========================

    function viewProject(id) {

        window.location.href =
            `/hr/projects/${id}`;
    }


    // =========================
    // EDIT
    // =========================

    function editProject(id) {

        window.location.href =
            `/hr/projects/${id}/edit`;
    }


    // =========================
    // DELETE
    // =========================

    async function deleteProject(id) {

        if (!confirm("Are you sure you want to delete this project?")) {
            return;
        }


        try {

            const response =
                await fetch(`/projects/${id}`, {

                    method: "DELETE"
                });


            if (!response.ok) {
                throw new Error("Failed to delete project");
            }


            alert("Project deleted successfully!");

            loadProjects();

        } catch (error) {

            console.error(error);

            alert("Error deleting project");
        }
    }


    // =========================
    // INITIAL LOAD
    // =========================

    loadProjects();

</script>

</body>
</html>
