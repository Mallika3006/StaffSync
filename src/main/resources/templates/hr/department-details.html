<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Department Details - StaffSync</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>

<body>

<div class="container">

    <h1>Department Details</h1>

    <div class="card" id="department">

        <p class="loading">
            Loading department details...
        </p>

    </div>

    <br>

    <button
            class="btn"
            onclick="editDepartment()">
        Edit Department
    </button>

    <br><br>

    <a
            class="back-link"
            href="/hr/departments">
        ← Back to Departments
    </a>

    <br><br>

    <a
            class="back-link"
            href="/hr-dashboard">
        ← Back to HR Dashboard
    </a>

</div>


<script>

    // ==========================================
    // GET DEPARTMENT ID FROM URL
    // ==========================================

    const pathParts =
        window.location.pathname.split("/");

    const departmentId =
        pathParts[pathParts.length - 1];


    // ==========================================
    // EDIT DEPARTMENT
    // ==========================================

    function editDepartment() {

        window.location.href =
            `/hr/departments/${departmentId}/edit`;
    }


    // ==========================================
    // LOAD DEPARTMENT
    // ==========================================

    fetch(`/departments/${departmentId}`)

        .then(response => {

            if (!response.ok) {

                throw new Error(
                    "Failed to load department"
                );
            }

            return response.json();
        })

        .then(department => {

            const container =
                document.getElementById(
                    "department"
                );


            container.innerHTML = `

                <div class="profile-row">

                    <span class="profile-label">
                        Department ID
                    </span>

                    <span>
                        ${department.departmentId ?? "N/A"}
                    </span>

                </div>


                <div class="profile-row">

                    <span class="profile-label">
                        Department Name
                    </span>

                    <span>
                        ${department.departmentName || "N/A"}
                    </span>

                </div>


                <div class="profile-row">

                    <span class="profile-label">
                        Location
                    </span>

                    <span>
                        ${department.location || "N/A"}
                    </span>

                </div>


                <div class="profile-row">

                    <span class="profile-label">
                        Description
                    </span>

                    <span>
                        ${department.description || "N/A"}
                    </span>

                </div>

            `;

        })


        // ==========================================
        // ERROR HANDLING
        // ==========================================

        .catch(error => {

            document.getElementById(
                "department"
            ).innerHTML =

                "<p class='error-message'>" +
                "Unable to load department details." +
                "</p>";

            console.error(error);

        });

</script>

</body>

</html>
