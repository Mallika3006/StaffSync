<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Project Details - StaffSync</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>

<body>

<div class="container">

    <h1>Project Details</h1>

    <div class="card">

        <p>
            <strong>Project ID:</strong>
            <span id="projectId"></span>
        </p>

        <p>
            <strong>Project Name:</strong>
            <span id="projectName"></span>
        </p>

        <p>
            <strong>Start Date:</strong>
            <span id="startDate"></span>
        </p>

        <p>
            <strong>End Date:</strong>
            <span id="endDate"></span>
        </p>

    </div>

    <div class="dashboard-links">

        <button onclick="editProject()">
            Edit Project
        </button>

        <a href="/hr/projects">
            Back to Projects
        </a>

        <a href="/hr-dashboard">
            Back to HR Dashboard
        </a>

    </div>

</div>

<script th:inline="javascript">

    const projectId = /*[[${projectId}]]*/ null;


    async function loadProject() {

        try {

            const response =
                await fetch(`/projects/${projectId}`);

            if (!response.ok) {
                throw new Error("Failed to fetch project");
            }

            const project =
                await response.json();


            document.getElementById("projectId").textContent =
                project.projectId;

            document.getElementById("projectName").textContent =
                project.projectName ?? "";

            document.getElementById("startDate").textContent =
                project.startDate ?? "N/A";

            document.getElementById("endDate").textContent =
                project.endDate ?? "Ongoing";


        } catch (error) {

            console.error(error);

            alert("Error loading project details");
        }
    }


    function editProject() {

        window.location.href =
            `/hr/projects/${projectId}/edit`;
    }


    loadProject();

</script>

</body>
</html>
