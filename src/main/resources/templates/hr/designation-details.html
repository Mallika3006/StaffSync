<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Designation Details - StaffSync</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>

<body>

<div class="container">

    <h1>Designation Details</h1>

    <div class="card">

        <p><strong>Designation ID:</strong> <span id="designationId"></span></p>

        <p><strong>Designation Title:</strong> <span id="designationTitle"></span></p>

        <p><strong>Minimum Salary:</strong> <span id="minSalary"></span></p>

        <p><strong>Maximum Salary:</strong> <span id="maxSalary"></span></p>

    </div>

    <div class="dashboard-links">
        <button onclick="editDesignation()">Edit Designation</button>
        <a href="/hr/designations">Back to Designations</a>
        <a href="/hr-dashboard">Back to HR Dashboard</a>
    </div>

</div>

<script th:inline="javascript">

    const designationId = /*[[${#httpServletRequest.getRequestURI().split('/')[3]}]]*/ null;

    async function loadDesignation() {

        try {

            const response = await fetch(`/designations/${designationId}`);

            if (!response.ok) {
                throw new Error("Failed to fetch designation");
            }

            const designation = await response.json();

            document.getElementById("designationId").textContent =
                designation.designationId;

            document.getElementById("designationTitle").textContent =
                designation.designationTitle;

            document.getElementById("minSalary").textContent =
                designation.minSalary;

            document.getElementById("maxSalary").textContent =
                designation.maxSalary;

        } catch (error) {

            console.error(error);

            alert("Error loading designation details");
        }
    }

    function editDesignation() {
        window.location.href = `/hr/designations/${designationId}/edit`;
    }

    loadDesignation();

</script>

</body>
</html>
