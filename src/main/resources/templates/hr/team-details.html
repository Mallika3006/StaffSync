<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Team Details - StaffSync</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>

<body>

<div class="container">

    <h1>Team Details</h1>

    <div class="card">

        <p>
            <strong>Team ID:</strong>
            <span id="teamId"></span>
        </p>

        <p>
            <strong>Team Name:</strong>
            <span id="teamName"></span>
        </p>

        <p>
            <strong>Description:</strong>
            <span id="description"></span>
        </p>

        <p>
            <strong>Department ID:</strong>
            <span id="departmentId"></span>
        </p>

    </div>

    <div class="dashboard-links">

        <button onclick="editTeam()">
            Edit Team
        </button>

        <a href="/hr/teams">
            Back to Teams
        </a>

        <a href="/hr-dashboard">
            Back to HR Dashboard
        </a>

    </div>

</div>

<script th:inline="javascript">

    const teamId = /*[[${teamId}]]*/ null;

    async function loadTeam() {

        try {

            const response = await fetch(`/teams/${teamId}`);

            if (!response.ok) {
                throw new Error("Failed to fetch team");
            }

            const team = await response.json();

            document.getElementById("teamId").textContent =
                team.teamId;

            document.getElementById("teamName").textContent =
                team.teamName;

            document.getElementById("description").textContent =
                team.description ?? "";

            document.getElementById("departmentId").textContent =
                team.department?.departmentId ?? "N/A";

        } catch (error) {

            console.error(error);

            alert("Error loading team details");
        }
    }

    function editTeam() {

        window.location.href =
            `/hr/teams/${teamId}/edit`;
    }

    loadTeam();

</script>

</body>
</html>
