<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Edit Department - StaffSync</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>

<body>

<div class="container">

    <h1>Edit Department</h1>

    <div class="card">

        <form id="departmentForm">

            <label>Department Name:</label>

            <input
                    type="text"
                    id="departmentName"
                    required>

            <br><br>

            <label>Location:</label>

            <input
                    type="text"
                    id="location">

            <br><br>

            <label>Description:</label>

            <textarea
                    id="description"></textarea>

            <br><br>

            <button type="submit">
                Update Department
            </button>

        </form>

    </div>


    <div class="dashboard-links">

        <a href="/hr/departments">
            Back to Departments
        </a>

        <a href="/hr-dashboard">
            Back to HR Dashboard
        </a>

    </div>

</div>


<script>

    // ==========================================
    // GET DEPARTMENT ID FROM URL
    // ==========================================

    const pathParts =
        window.location.pathname.split("/");

    const departmentId =
        pathParts[3];

    console.log(
        "Department ID:",
        departmentId
    );


    // ==========================================
    // LOAD DEPARTMENT
    // ==========================================

    async function loadDepartment() {

        try {

            const response =
                await fetch(
                    `/departments/${departmentId}`
                );


            if (!response.ok) {

                const errorText =
                    await response.text();

                console.error(errorText);

                throw new Error(
                    "Failed to fetch department"
                );
            }


            const department =
                await response.json();


            // Fill form with existing values

            document.getElementById(
                "departmentName"
            ).value =
                department.departmentName ?? "";


            document.getElementById(
                "location"
            ).value =
                department.location ?? "";


            document.getElementById(
                "description"
            ).value =
                department.description ?? "";


        } catch (error) {

            console.error(error);

            alert(
                "Error loading department"
            );
        }
    }


    // ==========================================
    // UPDATE DEPARTMENT
    // ==========================================

    document.getElementById(
        "departmentForm"
    ).addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            const department = {

                departmentName:
                document.getElementById(
                    "departmentName"
                ).value,

                location:
                document.getElementById(
                    "location"
                ).value,

                description:
                document.getElementById(
                    "description"
                ).value
            };


            try {

                const response =
                    await fetch(
                        `/departments/${departmentId}`,
                        {

                            method: "PUT",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify(
                                    department
                                )
                        }
                    );


                if (!response.ok) {

                    const errorText =
                        await response.text();

                    console.error(errorText);

                    throw new Error(
                        "Failed to update department"
                    );
                }


                alert(
                    "Department updated successfully!"
                );


                window.location.href =
                    "/hr/departments";


            } catch (error) {

                console.error(error);

                alert(
                    "Error updating department"
                );
            }

        }
    );


    // ==========================================
    // INITIAL LOAD
    // ==========================================

    loadDepartment();

</script>

</body>
</html>
