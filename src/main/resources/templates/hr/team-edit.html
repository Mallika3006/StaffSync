<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Edit Team - StaffSync</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>

<body>

<div class="container">

    <h1>Edit Team</h1>

    <div class="card">

        <form id="teamForm">

            <label>Team Name:</label>
            <input type="text" id="teamName" required>

            <br><br>

            <label>Description:</label>
            <textarea id="description"></textarea>

            <br><br>

            <label>Department:</label>
            <select id="departmentId" required>
                <option value="">Select Department</option>
            </select>

            <br><br>

            <button type="submit">
                Update Team
            </button>

        </form>

    </div>

    <div class="dashboard-links">

        <a href="/hr/teams">
            Back to Teams
        </a>

        <a href="/hr-dashboard">
            Back to HR Dashboard
        </a>

    </div>

</div>

<script th:inline="javascript">

    const teamId = /*[[${teamId}]]*/ null;


    // Load departments
    async function loadDepartments() {

        try {

            const response = await fetch("/departments");

            if (!response.ok) {
                throw new Error("Failed to fetch departments");
            }

            const departments = await response.json();

            const select =
                document.getElementById("departmentId");

            departments.forEach(department => {

                const option =
                    document.createElement("option");

                option.value =
                    department.departmentId;

                option.textContent =
                    department.departmentName;

                select.appendChild(option);
            });

        } catch (error) {

            console.error(error);

            alert("Error loading departments");
        }
    }


    // Load existing team
    async function loadTeam() {

        try {

            const response =
                await fetch(`/teams/${teamId}`);

            if (!response.ok) {
                throw new Error("Failed to fetch team");
            }

            const team =
                await response.json();

            document.getElementById("teamName").value =
                team.teamName ?? "";

            document.getElementById("description").value =
                team.description ?? "";

            if (team.department) {

                document.getElementById("departmentId").value =
                    team.department.departmentId;
            }

        } catch (error) {

            console.error(error);

            alert("Error loading team details");
        }
    }


    // Update team
    document.getElementById("teamForm")
        .addEventListener("submit", async function(event) {

            event.preventDefault();

            const departmentId =
                document.getElementById("departmentId").value;

            const teamData = {

                teamName:
                document.getElementById("teamName").value,

                description:
                document.getElementById("description").value,

                department: {
                    departmentId: Number(departmentId)
                }
            };


            try {

                const response = await fetch(`/teams/${teamId}`, {

                    method: "PUT",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify(teamData)
                });


                if (!response.ok) {

                    const errorText =
                        await response.text();

                    console.error(errorText);

                    throw new Error("Failed to update team");
                }


                alert("Team updated successfully!");

                window.location.href =
                    "/hr/teams";

            } catch (error) {

                console.error(error);

                alert("Error updating team");
            }

        });


    loadDepartments().then(() => {
        loadTeam();
    });

</script>

</body>
</html>
