<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>HR Attendance - StaffSync</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>

<body>

<div class="container">

    <h1>My Attendance</h1>

    <div class="card" id="attendance">
        <p class="loading">Loading attendance...</p>
    </div>

    <br>

    <a class="back-link" href="/hr-dashboard">
        ← Back to HR Dashboard
    </a>

</div>

<script>
    fetch('/attendance/me')
        .then(response => {
            if (!response.ok) {
                throw new Error("Failed to load attendance");
            }
            return response.json();
        })
        .then(attendance => {

            const container = document.getElementById("attendance");

            if (!attendance || attendance.length === 0) {
                container.innerHTML = "<p>No attendance records found.</p>";
                return;
            }

            container.innerHTML = `
                <table>
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Check In</th>
                            <th>Check Out</th>
                            <th>Status</th>
                        </tr>
                    </thead>

                    <tbody>
                        ${attendance.map(record => `
                            <tr>
                                <td>${record.date ?? "N/A"}</td>
                                <td>${record.checkIn ?? "N/A"}</td>
                                <td>${record.checkOut ?? "N/A"}</td>
                                <td>${record.status ?? "N/A"}</td>
                            </tr>
                        `).join("")}
                    </tbody>
                </table>
            `;
        })
        .catch(error => {
            document.getElementById("attendance").innerHTML =
                "<p class='error-message'>Unable to load attendance.</p>";

            console.error(error);
        });
</script>

</body>
</html>
