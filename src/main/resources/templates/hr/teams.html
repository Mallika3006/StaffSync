<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Teams - StaffSync</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>

<body>

<div class="container">

    <h1>Team Management</h1>

    <!-- ADD TEAM -->
    <div class="card">
        <h2>Add Team</h2>

        <form id="teamForm">

            <label>Team Name:</label>
            <input type="text" id="teamName" required>

            <label>Description:</label>
            <input type="text" id="description">

            <label>Department:</label>
            <select id="departmentId" required>
                <option value="">Select Department</option>
            </select>

            <button type="submit">Add Team</button>

        </form>
    </div>


    <!-- SEARCH -->
    <div class="card">

        <h2>Search Teams</h2>

        <input
                type="text"
                id="searchName"
                placeholder="Enter team name">

        <button onclick="searchTeams()">Search</button>
        <button onclick="loadTeams()">Show All</button>

    </div>


    <!-- TEAM TABLE -->
    <div class="card">

        <h2>Teams</h2>

        <table border="1">

            <thead>
            <tr>
                <th>Team ID</th>
                <th>Team Name</th>
                <th>Description</th>
                <th>Department ID</th>
                <th>Actions</th>
            </tr>
            </thead>

            <tbody id="teamTableBody">
            </tbody>

        </table>

    </div>


    <div class="card">
        <a href="/hr-dashboard">Back to HR Dashboard</a>
    </div>

</div>


<script>

    // LOAD DEPARTMENTS
    async function loadDepartments() {

        try {

            const response = await fetch('/departments');

            if (!response.ok) {
                throw new Error("Failed to load departments");
            }

            const departments = await response.json();

            const select = document.getElementById("departmentId");

            departments.forEach(department => {

                const option = document.createElement("option");

                option.value = department.departmentId;
                option.textContent =
                    department.departmentName;

                select.appendChild(option);

            });

        } catch (error) {

            console.error(error);

            alert("Error loading departments");
        }
    }


    // LOAD ALL TEAMS
    async function loadTeams() {

        try {

            const response = await fetch('/teams');

            if (!response.ok) {
                throw new Error("Failed to load teams");
            }

            const teams = await response.json();

            displayTeams(teams);

        } catch (error) {

            console.error(error);

            alert("Error loading teams");
        }
    }


    // SEARCH TEAMS
    async function searchTeams() {

        const name =
            document.getElementById("searchName").value.trim();

        if (name === "") {
            loadTeams();
            return;
        }

        try {

            const response =
                await fetch(
                    `/teams/search?name=${encodeURIComponent(name)}`
                );

            if (!response.ok) {
                throw new Error("Search failed");
            }

            const teams = await response.json();

            displayTeams(teams);

        } catch (error) {

            console.error(error);

            alert("Error searching teams");
        }
    }


    // DISPLAY TEAMS
    function displayTeams(teams) {

        const tbody =
            document.getElementById("teamTableBody");

        tbody.innerHTML = "";

        teams.forEach(team => {

            const row = document.createElement("tr");

            row.innerHTML = `
                <td>${team.teamId}</td>
                <td>${team.teamName}</td>
                <td>${team.description ?? ""}</td>
                <td>${team.department?.departmentId ?? "N/A"}</td>

                <td>
                    <button onclick="viewTeam(${team.teamId})">
                        View
                    </button>

                    <button onclick="editTeam(${team.teamId})">
                        Edit
                    </button>

                    <button onclick="deleteTeam(${team.teamId})">
                        Delete
                    </button>
                </td>
            `;

            tbody.appendChild(row);

        });
    }


    // ADD TEAM
    document.getElementById("teamForm")
        .addEventListener("submit", async function (event) {

            event.preventDefault();

            const departmentId =
                document.getElementById("departmentId").value;

            const team = {

                teamName:
                document.getElementById("teamName").value,

                description:
                document.getElementById("description").value,

                department: {
                    departmentId: Number(departmentId)
                }
            };


            try {

                const response = await fetch('/teams', {

                    method: 'POST',

                    headers: {
                        'Content-Type': 'application/json'
                    },

                    body: JSON.stringify(team)

                });


                if (!response.ok) {
                    throw new Error("Failed to create team");
                }


                alert("Team added successfully");

                document.getElementById("teamForm").reset();

                loadTeams();

            } catch (error) {

                console.error(error);

                alert("Error adding team");
            }

        });


    // VIEW
    function viewTeam(id) {

        window.location.href =
            `/hr/teams/${id}`;
    }


    // EDIT
    function editTeam(id) {

        window.location.href =
            `/hr/teams/${id}/edit`;
    }


    // DELETE
    async function deleteTeam(id) {

        if (!confirm("Are you sure you want to delete this team?")) {
            return;
        }

        try {

            const response =
                await fetch(`/teams/${id}`, {
                    method: 'DELETE'
                });


            if (!response.ok) {
                throw new Error("Failed to delete team");
            }


            alert("Team deleted successfully");

            loadTeams();

        } catch (error) {

            console.error(error);

            alert("Error deleting team");
        }
    }


    // INITIAL LOAD
    loadDepartments();
    loadTeams();

</script>

</body>
</html>
